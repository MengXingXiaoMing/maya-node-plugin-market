<style>

  .st-in{text-align:center;max-width:640px}
  .st-kicker{font:11px/1 "Cascadia Mono",Consolas,monospace;letter-spacing:4px;color:#5c6675;margin-bottom:26px}

var canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),bar=document.getElementById('bar');
var cw=0,ch=0,vs=1,vx=0,vy=0;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cw=Math.floor(window.innerWidth*dpr); ch=Math.floor(window.innerHeight*dpr);
  canvas.width=cw; canvas.height=ch;
  canvas.style.width=window.innerWidth+'px'; canvas.style.height=window.innerHeight+'px';
  vs=Math.min(cw/W,ch/H); vx=(cw-W*vs)/2; vy=(ch-H*vs)/2;
}
window.addEventListener('resize',resize); resize();

// ---------------- 数学 ----------------
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lin(t,a,b){return clamp((t-a)/(b-a),0,1);}
function easeOut(x){return 1-Math.pow(1-x,3);}
function easeInOut(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function easeOutQuint(x){return 1-Math.pow(1-x,5);}
function easeOutBack(x){var c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function win(t,a,b,c,d){if(t<=a||t>=d)return 0;if(t<b)return easeOut(lin(t,a,b));if(t<=c)return 1;return 1-easeInOut(lin(t,c,d));}

// ---------------- 绘制原语 ----------------
function font(size,weight){return (weight||400)+' '+size+'px '+MONO;}
function txt(s,x,y,size,color,alpha,align,weight,spacing,family){
  if(alpha===undefined)alpha=1;
  if(alpha<=0.004||s===undefined||s==='')return;
  ctx.save(); ctx.globalAlpha=alpha; ctx.font=(weight||400)+' '+size+'px '+(family||MONO);
  ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  if(spacing&&'letterSpacing' in ctx)ctx.letterSpacing=spacing+'px';
  ctx.fillText(String(s),x,y); ctx.restore();
}
function measure(s,size,weight,spacing,family){
  ctx.save(); ctx.font=(weight||400)+' '+size+'px '+(family||MONO);
  if(spacing&&'letterSpacing' in ctx)ctx.letterSpacing=spacing+'px';
  var w=ctx.measureText(String(s)).width; ctx.restore(); return w;
}
function rrect(x,y,w,h,r,fill,stroke,lw,alpha){
  if(alpha===undefined)alpha=1;
  if(alpha<=0.004||w<=0||h<=0)return;
  ctx.save(); ctx.globalAlpha=alpha;
  var rr=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath(); ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.lineWidth=lw||1;ctx.strokeStyle=stroke;ctx.stroke();}
  ctx.restore();
}
// 深色实心面板（实际 UI 用）
function solid(x,y,w,h,r,fill,alpha,stroke){
  rrect(x,y,w,h,r,fill,stroke||null,1,alpha);
}
function glow(x,y,r,color,alpha){
  if(alpha<=0.004||r<=0)return;
  ctx.save(); ctx.globalAlpha=alpha;
  var g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color);
  g.addColorStop(0.45,color.replace(/rgba\(([^,]+),([^,]+),([^,]+),([^)]+)\)/,
    function(m,a,b,c2,d){return 'rgba('+a+','+b+','+c2+','+(d*0.42)+')';}));
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function dot(x,y,r,color,alpha){
  if(alpha<=0.004)return;
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function line(x1,y1,x2,y2,color,alpha,lw,dash){
  if(alpha<=0.004)return;
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw||1;
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function hexRgb(hex){
  var m=String(hex).match(/^#?(..)(..)(..)$/);
  if(!m)return '74,134,232';
  return parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16);
}
function hexNode(cx,cy,r,color,alpha,fillA,hole){
  if(alpha<=0.004||r<=0)return;
  var rgb=hexRgb(color);
  ctx.save(); ctx.globalAlpha=alpha; ctx.beginPath();
  for(var i=0;i<6;i++){
    var a=Math.PI/6+i*Math.PI/3,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle='rgba('+rgb+','+((fillA===undefined)?0.14:fillA)+')'; ctx.fill();
  if(color){ctx.lineWidth=1.2;ctx.strokeStyle=color;ctx.stroke();}
  if(hole!==0){ctx.fillStyle='rgba(9,11,15,0.6)';
    ctx.beginPath(); ctx.arc(cx,cy,Math.max(2,r*0.24),0,Math.PI*2); ctx.fill();}
  ctx.restore();
}
function drawIcon(cx,cy,size,alpha,rot,glowA){
  if(alpha<=0.004||size<=1)return;
  if(glowA)glow(cx,cy,size*0.9,'rgba(74,134,232,0.5)',glowA);
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(cx,cy);
  if(rot)ctx.rotate(rot);
  if(ICON.complete&&ICON.naturalWidth)ctx.drawImage(ICON,-size/2,-size/2,size,size);
  else rrect(-size/2,-size/2,size,size,size*0.2,'#262a31','rgba(74,134,232,0.6)',2,1);
  ctx.restore();
}
// 插件图标方块：首字 + 品牌色渐变（与实际卡片一致）
function charTile(x,y,size,ch,accent,alpha){
  if(alpha<=0.004||size<=2)return;
  var g=ctx.createLinearGradient(x,y,x,y+size);
  g.addColorStop(0,accent);
  g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.save(); ctx.globalAlpha=alpha;
  rrect(x,y,size,size,Math.max(3,size*0.13),accent,null,0,1);
  ctx.fillStyle=g; rrect(x,y,size,size,Math.max(3,size*0.13),g,null,0,1);
  txt(ch,x+size/2,y+size*0.5+size*0.22,size*0.52,'#ffffff',1,'center',600,0,SANS);
  ctx.restore();
}
function chip(s,x,y,color,alpha,size,tint){
  size=size||11;
  var w=measure(s,size,500)+20;
  rrect(x,y,w,22,11,tint||'rgba(255,255,255,0.045)',color,1,alpha);
  txt(s,x+w/2,y+15,size,color,alpha,'center',500,0.3);
  return w;
}
function micro(s,x,y,alpha,color){

// =====================================================================
// 音频：程序化配乐 + 音效（Web Audio，无外部文件）
// =====================================================================
var AE=(function(){
  var ac=null,master=null,musicBus=null,sfxBus=null,reverb=null,delay=null,noiseBuf=null;
  var ready=false,muted=false,t0=null,nextStep=0;
  var BPM=84,beat=60/BPM,bar=beat*4,step=beat/2;
  var CHORDS=[
    [110,164.81,220,246.94],
    [87.31,130.81,174.61,220],
    [130.81,196,246.94,293.66],
    [98,146.83,196,246.94]
  ];
  var ARP=[0,1,2,3,2,1,0,2];

  function makeNoise(){
    var len=Math.floor(ac.sampleRate*2),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    return b;
  }
  function makeIR(sec,decay){
    var len=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,len,ac.sampleRate);
    for(var c=0;c<2;c++){
      var d=b.getChannelData(c);
      for(var i=0;i<len;i++){var k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,decay);}
    }
    return b;
  }
  function init(){
    if(ac)return true;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;
    ac=new AC();
    var comp=ac.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=18; comp.ratio.value=3;
    comp.attack.value=0.006; comp.release.value=0.25;
    comp.connect(ac.destination);
    master=ac.createGain(); master.gain.value=0.9; master.connect(comp);
    reverb=ac.createConvolver(); reverb.buffer=makeIR(3.0,2.6);
    var rg=ac.createGain(); rg.gain.value=0.30; reverb.connect(rg); rg.connect(master);
    delay=ac.createDelay(1.0); delay.delayTime.value=0.36;
    var fb=ac.createGain(); fb.gain.value=0.34; delay.connect(fb); fb.connect(delay);
    var dg=ac.createGain(); dg.gain.value=0.30; delay.connect(dg); dg.connect(master);
    musicBus=ac.createGain(); musicBus.gain.value=0.34;
    musicBus.connect(master); musicBus.connect(reverb); musicBus.connect(delay);
    sfxBus=ac.createGain(); sfxBus.gain.value=0.5; sfxBus.connect(master); sfxBus.connect(reverb);
    noiseBuf=makeNoise(); ready=true; return true;
  }

  function pad(freq,at,dur,amp){
    var g=ac.createGain(),f=ac.createBiquadFilter();
    f.type='lowpass'; f.Q.value=0.7;
    f.frequency.setValueAtTime(620,at);
    f.frequency.linearRampToValueAtTime(1400,at+dur*0.55);
    g.gain.setValueAtTime(0.0001,at);
    g.gain.linearRampToValueAtTime(amp,at+1.0);
    g.gain.linearRampToValueAtTime(amp*0.7,at+dur*0.62);
    g.gain.linearRampToValueAtTime(0.0001,at+dur);
    for(var i=0;i<2;i++){
      var o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=freq;
      o.detune.value=i?9:-9; o.connect(f); o.start(at); o.stop(at+dur+0.05);
    }
    f.connect(g); g.connect(musicBus);
  }
  function bass(freq,at,dur,amp){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.linearRampToValueAtTime(amp,at+0.1);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g); g.connect(musicBus); o.start(at); o.stop(at+dur+0.05);
  }
  function pluck(freq,at,amp){
    var o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
    o.type='triangle'; o.frequency.value=freq;
    f.type='lowpass'; f.frequency.value=2400;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(amp,at+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,at+0.5);
    o.connect(f); f.connect(g); g.connect(musicBus); g.connect(delay);
    o.start(at); o.stop(at+0.55);
  }
  function kick(at,amp){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(118,at);
    o.frequency.exponentialRampToValueAtTime(44,at+0.22);
    g.gain.setValueAtTime(0.0001,at);
    g.gain.linearRampToValueAtTime(amp,at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,at+0.42);
    o.connect(g); g.connect(musicBus); o.start(at); o.stop(at+0.5);
  }
  function hat(at,amp){
    var s=ac.createBufferSource(); s.buffer=noiseBuf;
    var f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=6200;
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(amp,at+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,at+0.07);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(at); s.stop(at+0.1);
  }
  function whoosh(at,dur,amp,up){
    var s=ac.createBufferSource(); s.buffer=noiseBuf;
    var f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
    f.frequency.setValueAtTime(up?300:5200,at);
    f.frequency.exponentialRampToValueAtTime(up?5200:300,at+dur);
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,at);
    g.gain.linearRampToValueAtTime(amp,at+dur*0.45);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    s.connect(f); f.connect(g); g.connect(sfxBus);
    s.start(at); s.stop(at+dur+0.05);
  }
  function ding(freq,at,amp,dur){
    dur=dur||1.4;
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(amp,at+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    var o1=ac.createOscillator(),o2=ac.createOscillator(),g2=ac.createGain();
    o1.type='sine'; o1.frequency.value=freq;
    o2.type='sine'; o2.frequency.value=freq*2.01; g2.gain.value=0.3;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(sfxBus); g.connect(reverb);
    o1.start(at); o2.start(at); o1.stop(at+dur+0.1); o2.stop(at+dur+0.1);
  }
  function clickSfx(at,amp){
    var s=ac.createBufferSource(); s.buffer=noiseBuf;
    var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=0.8;
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,at);
    g.gain.linearRampToValueAtTime(amp,at+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,at+0.05);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(at); s.stop(at+0.08);
  }
  function energy(vt){
    if(vt<8)return 0.35;
    if(vt<22)return 0.6;
    if(vt<34)return 0.82;
    return 1;
  }
  function stepAt(vt,at){
    var barIdx=Math.floor(vt/bar)%4,inBar=vt-bar*Math.floor(vt/bar),e=energy(vt);
    if(inBar<step*0.45){
      var ch=CHORDS[barIdx];
      for(var i=0;i<ch.length;i++)pad(ch[i],at,bar+0.6,0.05*e);
      bass(ch[0],at,bar*0.55,0.12*e);
      bass(ch[0],at+beat*2,bar*0.4,0.09*e);
      if(e>0.5){kick(at,0.15*e);kick(at+beat*2,0.12*e);}
    }
    var idx=Math.floor(inBar/step)%8,ch2=CHORDS[barIdx];
    pluck(ch2[ARP[idx]]*(idx%2?2:1),at,0.045*e);
    if(e>0.62)hat(at,0.028*e);
  }
  function fire(name,vt){
    if(!ready||muted||!ac||t0===null)return;
    var at=t0+vt+0.02;
    switch(name){
      case 'tick': clickSfx(at,0.04); break;
      case 'click': clickSfx(at,0.10); break;
      case 'pop0': ding(784,at,0.05,0.5); break;
      case 'pop1': ding(880,at,0.05,0.5); break;
      case 'pop2': ding(1046.5,at,0.05,0.5); break;
      case 'pop3': ding(1174.7,at,0.05,0.5); break;
      case 'switch': clickSfx(at,0.08); ding(1318.5,at+0.01,0.035,0.3); break;
      case 'chime':
        ding(784,at,0.06,1.5); ding(1174.7,at+0.09,0.05,1.6);
        ding(1567.98,at+0.18,0.035,1.4); break;
      case 'whoosh': whoosh(at,0.85,0.14,true); break;
      case 'riser': whoosh(at,1.6,0.16,true); break;
      case 'rise': whoosh(at,0.7,0.10,true); break;
      case 'swell':
        for(var i=0;i<CHORDS[0].length;i++)pad(CHORDS[0][i]*2,at,3.4,0.08);
        bass(CHORDS[0][0],at,3.0,0.16);
        ding(523.25,at+0.2,0.05,2.4);
        break;
      default: break;
    }
  }
  function pump(vt,playing){
    if(!ready||muted||!playing)return;
    // 每帧按当前虚拟时间重新锚定：节奏放慢/停顿后，音乐与画面仍然同步
    t0=ac.currentTime-vt;
    if(nextStep<vt-0.4||nextStep>vt+3.2)nextStep=Math.ceil(vt/step)*step;
    var horizon=vt+0.4;
    while(nextStep<horizon){
      stepAt(nextStep,t0+nextStep);
      nextStep+=step;
    }
  }
  return {
    init:function(){
      var ok=init();
      if(ok&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
      return ok;
    },
    ok:function(){return ready;},
    muted:function(){return muted;},
    setMuted:function(m){
      muted=m;
      if(master)master.gain.setTargetAtTime(m?0:0.9,ac.currentTime,0.12);
    },
    start:function(vt){if(ac){t0=ac.currentTime-vt;nextStep=Math.ceil(vt/step)*step;}},
    setPlaying:function(on){if(musicBus)musicBus.gain.setTargetAtTime(on?0.34:0,ac.currentTime,0.2);},
    state:function(){return ac?ac.state:'none';},
    pump:pump,fire:fire
  };
})();

var EVENTS=[
  [0.0,'riser'],[0.9,'tick'],[2.5,'tick'],[4.1,'tick'],[5.7,'tick'],[7.3,'tick'],
  [7.95,'whoosh'],[9.9,'chime'],[11.6,'whoosh'],
  [12.9,'pop0'],[13.0,'pop1'],[13.1,'pop2'],[13.2,'pop3'],
  [14.2,'switch'],[15.55,'click'],[15.72,'chime'],
  [16.8,'whoosh'],[18.0,'tick'],[19.2,'tick'],[20.55,'click'],[20.95,'chime'],
  [21.9,'whoosh'],[24.7,'click'],[26.05,'chime'],
  [28.32,'whoosh'],[29.3,'switch'],[30.85,'whoosh'],[31.5,'tick'],[32.1,'click'],[32.4,'chime'],
  [33.9,'whoosh'],[34.9,'tick'],[35.6,'chime'],[36.4,'rise'],[40.32,'whoosh'],
  [41.0,'pop0'],[41.16,'pop1'],[41.32,'pop2'],[41.48,'pop3'],[43.2,'chime'],
  [47.3,'riser'],[47.9,'chime'],[49.2,'swell'],[51.2,'chime']
];

// =====================================================================
// 主循环
// =====================================================================
var t=0,playing=true,last=0,started=false,audioOn=false,evIdx=0,lastT=0;

var qs=new URLSearchParams(window.location.search);
var seekTo=parseFloat(qs.get('t'));
var seekMode=isFinite(seekTo);
if(seekMode){t=clamp(seekTo,0,DUR-0.05);playing=false;lastT=t;}

// =====================================================================
// 人声解读 + 节奏控制
// =====================================================================
var capEl=document.getElementById('cap');
var synth=window.speechSynthesis||null;
var zhVoice=null,cueUtter=null;

function pickVoice(){
  if(!synth||!synth.getVoices)return;
  var all=[];
  try{all=synth.getVoices()||[];}catch(e){all=[];}
  if(!all.length)return;
  var zh=[];
  for(var i=0;i<all.length;i++){
    var lang=(all[i].lang||'')+'';
    if(/^zh|cmn|Chinese/i.test(lang)||/中文|普通话/.test(all[i].name||''))zh.push(all[i]);
  }
  var prefer=['Xiaoxiao','Yunxi','Yunyang','Huihui','Yaoyao','Kangkang','Tingting'];
  for(var p=0;p<prefer.length&&!zhVoice;p++){
    for(var j=0;j<zh.length;j++){
      if((zh[j].name||'').indexOf(prefer[p])>=0){zhVoice=zh[j];break;}
    }
  }
  if(!zhVoice&&zh.length)zhVoice=zh[0];
}
if(synth){
  pickVoice();
  if(synth.addEventListener)synth.addEventListener('voiceschanged',pickVoice);
}

function startCue(c){
  c.started=true; c.released=false;
  if(capEl){capEl.textContent=c.text;capEl.classList.add('on');}
  // 兜底时长：语音引擎不回调时，也保证停够时间再走
  c.releaseAt=Date.now()+1000+c.text.length*260;
  if(!synth||!audioOn||AE.muted())return;   // 静音/无语音引擎：只出字幕，按字数停留
  try{synth.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(c.text);
  u.lang='zh-CN'; u.rate=0.95; u.pitch=1;
  if(zhVoice)u.voice=zhVoice;
  u.onend=function(){c.releaseAt=Date.now()+520;};
  // 被我们自己 cancel 掉的不算失败；语音引擎不可用时按字数兜底停留
  u.onerror=function(ev){
    var why=(ev&&ev.error)||'';
    if(why==='interrupted'||why==='canceled')return;
    c.releaseAt=Date.now()+600;
  };
  cueUtter=u;
  try{synth.speak(u);}catch(e){}
}

function tickNarration(){
  for(var i=0;i<NARR.length;i++){
    var c=NARR[i];
    if(!c.started&&t>=c.at)startCue(c);
  }
}

function resetNarration(){
  for(var i=0;i<NARR.length;i++){
    NARR[i].started=false;NARR[i].released=false;NARR[i].releaseAt=0;
  }
  holdIdx=0;holdUntil=0;
  if(synth&&cueUtter){try{synth.cancel();}catch(e){}}
  cueUtter=null;
  if(capEl)capEl.classList.remove('on');
}

function silenceNarration(){
  // 静音时立刻放行当前这句，避免时间闸门空等到兜底时长
  if(synth&&cueUtter){try{synth.cancel();}catch(e){}}
  cueUtter=null;
  for(var i=0;i<NARR.length;i++){
    var c=NARR[i];
    if(c.started&&!c.released)c.releaseAt=Date.now();
  }
  if(capEl)capEl.classList.remove('on');
}

function clampTime(from,to){
  // 1) 关键画面停顿
  var h=HOLDS[holdIdx];
  if(h&&from>=h[0]-0.0005){
    if(Date.now()<holdUntil)return h[0];
    holdIdx++;
  }else if(h&&to>=h[0]){
    holdUntil=Date.now()+h[1];
    return h[0];
  }
  // 2) 人声没播完：停在 stop 处等它
  for(var i=0;i<NARR.length;i++){
    var c=NARR[i];
    if(!c.started||c.released)continue;
    if(to>c.stop&&from<=c.stop){
      if(Date.now()>=c.releaseAt){c.released=true;if(capEl)capEl.classList.remove('on');}
      else return c.stop;
    }
  }
  return to;
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cw,ch);
  ctx.setTransform(vs,0,0,vs,vx,vy);

  bg(t);
  sceneBeats(t);
  sceneGather(t);
  sceneMarket(t);
  sceneInstall(t);
  sceneDelivery(t);
  sceneAutoLoad(t);
  sceneEcosystem(t);
  sceneFeatures(t);
  sceneFinale(t);

  var vg=ctx.createRadialGradient(W/2,H*0.47,380,W/2,H*0.47,1010);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.66)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  grain();
}

function fireEvents(prev,cur){
  if(cur<prev){evIdx=0;return;}
  while(evIdx<EVENTS.length&&EVENTS[evIdx][0]<=cur){
    if(EVENTS[evIdx][0]>prev)AE.fire(EVENTS[evIdx][1],EVENTS[evIdx][0]);
    evIdx++;
  }
}

function frame(now){
  if(!last)last=now;
  var dt=Math.min(0.06,(now-last)/1000);
  last=now;
  if(playing){
    tickNarration();
    // 慢放 + 关键停顿 + 人声闸门：时间只在 clampTime 放行时才推进
    var nt=clampTime(t,t+dt*RATE);
    if(nt>t){
      t=nt;
      if(t>=DUR){t=0;evIdx=0;lastT=0;AE.start(0);resetNarration();}
      if(audioOn)fireEvents(lastT,t);
      lastT=t;
    }
  }
  draw();
  if(audioOn)AE.pump(t,playing);
  if(audioOn){var s=AE.state(); if(s!==lastAcState){lastAcState=s;syncMute();}}
  bar.style.width=(t/DUR*100)+'%';
  requestAnimationFrame(frame);
}

var startEl=document.getElementById('start');
var muteBtn=document.getElementById('mute');

function syncMute(){
  var m=AE.muted();
  var live=audioOn&&AE.ok()&&AE.state()==='running';
  muteBtn.textContent=m?'✕ 已静音':(live?'♪ 声音':'♪ 声音 · 点此开启');
  muteBtn.style.color=(m&&audioOn)?'#8d96a4':'#c9d0db';
}
var lastAcState='';
function begin(seek){
  started=true; audioOn=true;
  AE.init(); AE.setPlaying(true);
  AE.start(seek?t:0);
  if(!seek){t=0;evIdx=0;lastT=0;resetNarration();}
  else{evIdx=0;lastT=t;}
  startEl.classList.add('hide');
  playing=true; last=0;
  syncMute();
}
document.getElementById('go').addEventListener('click',function(){begin(false);});
muteBtn.addEventListener('click',function(){
  if(!audioOn){
    if(AE.init()){audioOn=true;AE.setPlaying(playing);AE.start(t);lastT=t;evIdx=0;}
  }
  AE.setMuted(!AE.muted()); syncMute();
  if(AE.muted())silenceNarration();
});
document.getElementById('replay').addEventListener('click',function(){
  t=0;playing=true;last=0;evIdx=0;lastT=0;resetNarration();
  if(audioOn)AE.start(0);
});
window.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault(); playing=!playing; last=0;
    if(audioOn){AE.setPlaying(playing); if(playing)AE.start(t);}
    // 人声跟着暂停/继续，避免画面停了旁白还在说
    if(synth){try{playing?synth.resume():synth.pause();}catch(err){}}}
  if(e.key==='r'||e.key==='R'){
    t=0;playing=true;last=0;evIdx=0;lastT=0;resetNarration(); if(audioOn)AE.start(0);
  }
  if(e.key==='m'||e.key==='M'){
    if(!audioOn&&AE.init()){audioOn=true;AE.setPlaying(playing);AE.start(t);lastT=t;evIdx=0;}
    AE.setMuted(!AE.muted()); syncMute();
  if(AE.muted())silenceNarration();
  }
});

if(seekMode){startEl.classList.add('hide'); syncMute();}
requestAnimationFrame(frame);
})();
</script>
</body>
